[project]
name = "hoa-qa"
version = "0.1.0"
description = "Document-grounded Lakewood Creek HOA Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2,<3",
    "typesafe-sdk>=0.7.2,<0.8",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
hoa-qa = "hoa_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
# Corpus build only (python -m hoa_qa.ingest). Kept out of [project] dependencies
# so the Vercel runtime never installs them: PyMuPDF is AGPL-licensed and large.
ingest = [
    "beautifulsoup4>=4.15.0,<5",
    "pymupdf>=1.28.2,<2",
    "pyyaml>=6.0.3,<7",
]
# dev includes ingest so the default `uv sync --locked` (CI) tests and type-checks
# the ingest package; `--no-dev` installs (and the Vercel runtime) never get it.
dev = [
    { include-group = "ingest" },
    "ruff",
    "pyright",
    "pytest",
    "pre-commit",
    # Runs the budget's Redis Lua script in tests (tests/web/web_fakes.py).
    "lupa>=2.8,<3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
# Test helper modules imported by bare name (see tests/integration/conftest.py).
extraPaths = ["tests/qa", "tests/web"]
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Jev and Anthropic APIs (needs TYPESAFE_API_KEY and ANTHROPIC_API_KEY)",
]

[tool.vercel]
# Vercel's FastAPI preset loads `app` from api/index.py (see docs/web-ops.md).
entrypoint = "api.index:app"
