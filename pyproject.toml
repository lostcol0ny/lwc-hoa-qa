[project]
name = "hoa-qa"
version = "0.1.0"
description = "Document-grounded Lakewood Creek HOA Q&A"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi>=0.141.1,<1",
    "httpx>=0.28.1,<1",
    "pydantic>=2,<3",
    "typesafe-sdk>=0.7.2,<0.8",
    "uvicorn>=0.54.0,<1",
]

[project.scripts]
hoa-qa = "hoa_qa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pre-commit",
    "pyyaml>=6.0.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: calls the real Jev and Anthropic APIs (needs TYPESAFE_API_KEY and ANTHROPIC_API_KEY)",
]

[tool.vercel]
# Vercel's FastAPI preset loads `app` from api/index.py (see docs/web-ops.md).
entrypoint = "api.index:app"
