name: Eval
# Golden eval against the real APIs (spec §7). About $0.55 per run; see
# README "Cost model". Manual, plus weekly on main to catch drift in the
# models it depends on (Jev, the answer model). Never runs on push or
# pull_request.
on:
  schedule:
    # Mondays 14:23 UTC (morning in Illinois). Scheduled runs use main.
    - cron: '23 14 * * 1'
  workflow_dispatch:
    inputs:
      corpus:
        description: Use the latest 'corpus' artifact from build-corpus.yml, or build one now (--no-llm)
        type: choice
        options: [artifact, build]
        default: artifact
      min_pass:
        description: Fail the run below this pass rate (0-1)
        type: string
        default: '0.85'
permissions:
  contents: read
env:
  UV_LOCKED: "1"
  # A scheduled run has no inputs: it evaluates what production serves (the
  # latest corpus artifact) at the default bar.
  CORPUS: ${{ inputs.corpus || 'artifact' }}
  MIN_PASS: ${{ inputs.min_pass || '0.85' }}
concurrency:
  group: eval
  cancel-in-progress: false
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the corpus artifact from build-corpus.yml
    steps:
      - name: Check API secrets
        id: secrets
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Eval skipped"
              echo "TYPESAFE_API_KEY or ANTHROPIC_API_KEY is not set."
              echo "Add both repository secrets (README, launch checklist step 1), then re-run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.secrets.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          enable-cache: true
      # The default groups include `ingest` (PyYAML for golden.yaml, PyMuPDF
      # for building the corpus).
      - run: uv sync --locked
        if: steps.secrets.outputs.enabled == 'true'
      - name: Download latest corpus artifact
        if: steps.secrets.outputs.enabled == 'true' && env.CORPUS == 'artifact'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-corpus.yml \
            --branch main --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful build-corpus.yml run on main. Run 'Build corpus' first, or re-run this with corpus=build."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name corpus --dir build
          test -f build/corpus.json
          echo "Corpus: build-corpus run $run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Build corpus (no LLM cleanup)
        if: steps.secrets.outputs.enabled == 'true' && env.CORPUS == 'build'
        run: |
          uv run python -m hoa_qa.ingest build --out build/ --no-llm
          echo "Corpus: built in this run (--no-llm)" >> "$GITHUB_STEP_SUMMARY"
      - name: Run golden eval
        if: steps.secrets.outputs.enabled == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: with these set, each golden question is traced to
          # Langfuse (docs/web-ops.md, "Tracing"). The golden questions are
          # committed fixtures, so their text is included.
          LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL }}
          TRACE_CONTENT: "1"
          TRACE_ENVIRONMENT: eval
        run: |
          set -o pipefail
          uv run hoa-qa eval evals/golden.yaml --corpus build/corpus.json \
            --json eval-results.json --min-pass "$MIN_PASS" | tee eval-table.txt
      - name: Summarize
        if: always() && steps.secrets.outputs.enabled == 'true'
        run: |
          if [ -f eval-table.txt ]; then
            { echo '### Golden eval'; echo '```'; cat eval-table.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.secrets.outputs.enabled == 'true'
        with:
          name: eval-results
          path: |
            eval-results.json
            eval-table.txt
          if-no-files-found: warn
          retention-days: 30
