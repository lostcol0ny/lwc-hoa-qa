name: Deploy
on:
  pull_request:
  workflow_run:
    workflows: [Build corpus]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
env:
  UV_LOCKED: "1"
  VERCEL_CLI_VERSION: "60.1.3"
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('deploy-pull_request-{0}', github.ref) || 'deploy-production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # download the corpus artifact from build-corpus.yml
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TARGET: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Deploy skipped"
              echo "VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID is not set"
              echo "(fork PRs never receive secrets). See docs/web-ops.md."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Select corpus artifact
        id: corpus
        if: steps.secrets.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TRIGGER_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          latest_run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-corpus.yml \
            --branch main --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId')"
          if [ -z "$latest_run_id" ] || [ "$latest_run_id" = "null" ]; then
            echo "::error::No successful build-corpus.yml run on main. Run the 'Build corpus' workflow first."
            exit 1
          fi
          run_id="$latest_run_id"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            run_id="$TRIGGER_RUN_ID"
            if [ "$run_id" -lt "$latest_run_id" ]; then
              echo "### Deploy skipped: corpus run $run_id is older than successful run $latest_run_id" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.corpus.outputs.run_id != ''
        with:
          # Production always checks out current main, never the build's old SHA:
          # main may have advanced while the corpus built or this deploy queued.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          persist-credentials: false
      - name: Download selected corpus artifact
        if: steps.corpus.outputs.run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          run_id: ${{ steps.corpus.outputs.run_id }}
        run: |
          if ! gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name corpus --dir corpus-artifact; then
            echo "::error::Run $run_id has no 'corpus' artifact (it may have expired). Re-run 'Build corpus'."
            exit 1
          fi
          for f in corpus.json corpus_manifest.json; do
            if [ ! -f "corpus-artifact/$f" ]; then
              echo "::error::The 'corpus' artifact from run $run_id is missing $f."
              exit 1
            fi
          done
          mv corpus-artifact/corpus.json corpus-artifact/corpus_manifest.json .
          echo "Using corpus from build-corpus run $run_id" >> "$GITHUB_STEP_SUMMARY"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.corpus.outputs.run_id != ''
        with:
          python-version: '3.12'
      - name: Validate corpus
        if: steps.corpus.outputs.run_id != ''
        run: uv run --no-dev python -c "from hoa_qa.models import load_corpus; load_corpus('corpus.json')"
      - name: Install Vercel CLI
        if: steps.corpus.outputs.run_id != ''
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"
      - name: Pull Vercel project settings
        if: steps.corpus.outputs.run_id != ''
        run: vercel pull --yes --environment="$VERCEL_TARGET" --token="$VERCEL_TOKEN"
      - name: Build
        if: steps.corpus.outputs.run_id != ''
        run: |
          if [ "$VERCEL_TARGET" = production ]; then
            vercel build --prod --token="$VERCEL_TOKEN"
          else
            vercel build --token="$VERCEL_TOKEN"
          fi
      - name: Deploy
        if: steps.corpus.outputs.run_id != ''
        run: |
          if [ "$VERCEL_TARGET" = production ]; then
            url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          else
            url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          fi
          echo "### Deployed ($VERCEL_TARGET): $url" >> "$GITHUB_STEP_SUMMARY"
