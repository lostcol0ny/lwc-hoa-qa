name: Answer cache
# Manual: verifies the reviewed answers in evals/cache_questions.yaml against
# the corpus (drafting any that have no claims yet), then scores the cache
# matcher on known paraphrases and near-misses. Costs about as much as
# an eval run. Never runs on push or pull_request, and does not deploy: the
# built cache is an artifact to review (docs/qa-core.md, "Curated answer cache").
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  UV_LOCKED: "1"
concurrency:
  group: answer-cache
  cancel-in-progress: false
jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # download the corpus artifact from build-corpus.yml
    steps:
      - name: Check API secrets
        id: secrets
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$TYPESAFE_API_KEY" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Answer cache skipped"
              echo "TYPESAFE_API_KEY or ANTHROPIC_API_KEY is not set."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.enabled == 'true'
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        if: steps.secrets.outputs.enabled == 'true'
        with:
          python-version: '3.12'
          enable-cache: true
      # The default groups include `ingest` (PyYAML for the question lists).
      - run: uv sync --locked
        if: steps.secrets.outputs.enabled == 'true'
      - name: Download latest corpus artifact
        if: steps.secrets.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-corpus.yml \
            --branch main --status success --limit 1 --json databaseId \
            --jq '.[0].databaseId' 2>/dev/null || true)"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::No successful build-corpus.yml run on main. Run 'Build corpus' first."
            exit 1
          fi
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name corpus --dir build
          test -f build/corpus.json
          echo "Corpus: build-corpus run $run_id" >> "$GITHUB_STEP_SUMMARY"
      - name: Build the cache
        if: steps.secrets.outputs.enabled == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          uv run hoa-qa cache build evals/cache_questions.yaml \
            --corpus build/corpus.json --out answer_cache.json \
            --propose proposed_questions.yaml | tee cache-build.txt
      - name: Check the matcher
        if: steps.secrets.outputs.enabled == 'true'
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          set -o pipefail
          uv run hoa-qa cache check evals/cache_cases.yaml \
            --cache answer_cache.json | tee cache-check.txt
      - name: Summarize
        if: always() && steps.secrets.outputs.enabled == 'true'
        run: |
          for f in cache-build.txt cache-check.txt; do
            if [ -f "$f" ]; then
              { echo "### $f"; echo '```'; cat "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.secrets.outputs.enabled == 'true'
        with:
          name: answer-cache
          path: |
            answer_cache.json
            proposed_questions.yaml
            cache-build.txt
            cache-check.txt
          if-no-files-found: warn
          retention-days: 30
