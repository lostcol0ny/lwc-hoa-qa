- id: records-inspection
  question: Can I inspect the Association's financial records?
  claims:
  - statement: The Declaration requires the Association to maintain its books, records, and
      financial statements and make them available for examination and copying at convenient
      hours of weekdays by any Owners or their mortgagees and their duly authorized agents
      and attorneys.
    citations:
    - chunk_id: declaration-10.1
      quote: 'The Association shall maintain the following records and make them available
        for examination and copying at convenient hours of weekdays by any Owners or their
        mortgagees and their duly authorized agents and attorneys:'
    - chunk_id: declaration-10.1.1
      quote: the Association's books, records, and financial statements;
  - statement: 765 ILCS 160/1-30 states that the board shall maintain detailed and accurate
      records in chronological order of the receipts and expenditures affecting the common
      areas, and make them available for examination and copying at convenient hours of weekdays
      by any member or unit owner, their mortgagees, and their duly authorized agents or attorneys.
    citations:
    - chunk_id: cicaa-1-30-c
      quote: Detailed and accurate records in chronological order of the receipts and expenditures
        affecting the common areas, specifying and itemizing the maintenance and repair expenses
        of the common areas and any other expenses incurred, and copies of all contracts,
        leases, or other agreements entered into by the board shall be maintained.
    - chunk_id: cicaa-1-30-c
      quote: 'make them available for examination and copying at convenient hours of weekdays
        by any member or unit owner in a common interest community subject to the authority
        of the board, their mortgagees, and their duly authorized agents or attorneys:'
  - statement: Under the Declaration, where a request for records is made in writing to the
      Association or its agent, failure to provide the requested record or to respond within
      thirty (30) days is deemed a denial.
    citations:
    - chunk_id: declaration-10.1.5
      quote: Where a request for records under this Section is made in wiiting to the Association
        or its agent, failure to provide the requested record or to respond within thirty
        (30) days shall be deemed a denial by the Association.
  - statement: The Declaration allows the Association to charge a reasonable fee for the cost
      of copying records.
    citations:
    - chunk_id: declaration-10.1.5
      quote: A reasonable fee may be charged by the Association for the cost of copying records.
- id: cicaa-applies
  question: Does the Common Interest Community Association Act apply to Lakewood Creek?
  claims:
  - statement: 765 ILCS 160/1-10 states that the provisions of the Common Interest Community
      Association Act are applicable to all common interest community associations in the
      State of Illinois unless expressly provided otherwise.
    citations:
    - chunk_id: cicaa-1-10
      quote: Unless expressly provided otherwise herein, the provisions of this Act are applicable
        to all common interest community associations in this State.
  - statement: 765 ILCS 160/1-75 states that a common interest community association organized
      under the General Not for Profit Corporation Act of 1986 with either 10 units or less
      or annual budgeted assessments of $100,000 or less is exempt from the Act unless it
      affirmatively elects to be covered.
    citations:
    - chunk_id: cicaa-1-75
      quote: A common interest community association organized under the General Not for Profit
        Corporation Act of 1986 and having either (i) 10 units or less or (ii) annual budgeted
        assessments of $100,000 or less shall be exempt from this Act unless the association
        affirmatively elects to be covered by this Act by a majority of its directors or members.
  - statement: Lakewood Creek Homeowners Association is organized as an Illinois not-for-profit
      corporation.
    citations:
    - chunk_id: declaration-7.1
      quote: Developer shall form an Illinois not-for-profit corporation to be known as the
        " Lakewood Creek Homeowners Association"
- id: director-removal
  question: How can a director be removed from the Board?
  claims:
  - statement: The Bylaws state that any director may be removed from the Board, with or without
      cause, by a majority vote of the Members of the Association.
    citations:
    - chunk_id: bylaws-5.3
      quote: Any director may be temoved from the Board, with or without cause, by a majotity
        vote of the Members of the Association.
  - statement: Illinois statute 805 ILCS 105/108.35(c)(1) states that in a corporation with
      members entitled to vote for directors, a director may be removed by the affirmative
      vote of two-thirds of the votes present and voted, either in person or by proxy.
    citations:
    - chunk_id: nfp-act-108.35-a
      quote: A director may be removed by the affirmative vote of two-thirds of the votes
        present and voted, either in person or by proxy.
  - statement: Illinois statute 765 ILCS 160/1-35(c) states that two-thirds of the membership
      may remove a board member as a director at a duly called special meeting.
    citations:
    - chunk_id: cicaa-1-35-a
      quote: Two-thirds of the membership may remove a board member as a director at a duly
        called special meeting.
  - statement: When a director is removed, their successor is selected by the remaining Members
      of the Board and serves for the unexpired term of the predecessor.
    citations:
    - chunk_id: bylaws-5.3
      quote: In the event of death, resignation, or removal of a director, his successor shall
        be sclected by the remaining Members of the Board and shall serve for the unexpired
        term of his predecessor
  - statement: Illinois statute 805 ILCS 105/108.35(c)(2) requires that written notice of
      a member meeting to remove a director must be delivered to all members entitled to vote,
      and must state that a purpose of the meeting is to vote upon the removal of one or more
      named directors.
    citations:
    - chunk_id: nfp-act-108.35-a
      quote: No director shall be removed at a meeting of members entitled to vote unless
        the written notice of such meeting is delivered to all members entitled to vote on
        removal of directors. Such notice shall state that a purpose of the meeting is to
        vote upon the removal of one or more directors named in the notice.
  - statement: 'The Bylaws and Illinois statute 765 ILCS 160/1-35(c) differ on the voting
      threshold: the Bylaws require a majority vote of Members, while the statute requires
      two-thirds of the membership.'
    kind: conflict
    citations:
    - chunk_id: bylaws-5.3
      quote: by a majotity vote of the Members of the Association
    - chunk_id: cicaa-1-35-a
      quote: Two-thirds of the membership may remove a board member
