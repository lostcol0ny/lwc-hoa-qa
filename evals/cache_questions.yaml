# Curated answer cache (docs/qa-core.md, "Curated answer cache"). Build with:
#   uv run hoa-qa cache build evals/cache_questions.yaml \
#     --corpus build/corpus.json --out build/answer_cache.json
#
# A resident's question that Jev judges to be the same as one of these gets
# the stored answer instead of a fresh one.
#
# `claims` is the answer residents will see, sentence by sentence, in this
# order. The build does not rewrite it: it checks that every quote is in the
# cited passage word for word and that the passages state everything the
# sentence says, and stores the answer only if every claim passes. So a change
# here is a change to what residents read, and it goes through review like
# code. If the documents change and a claim no longer holds, the build fails
# for that question instead of serving stale text.
#
# A question with no `claims` is drafted by the answer model at build time.
# Use that to get a first version: `--propose FILE` writes this list with the
# drafted claims filled in, ready to review, edit and commit.
#
# Keep entries distinct: two entries that ask nearly the same thing would have
# two different stored answers for one question.
#
# No individuals' names belong in this file.
questions:
- id: dues-current
  question: How much are the HOA dues this year?
  claims:
  - statement: As of 2026, the HOA assessment is $452 per year or $113 per quarter, with payments
      due January 1, April 1, July 1, and October 1.
    citations:
    - chunk_id: home-1
      quote: '2026 Assessment Prices: $452 year or $113 per quarter: Jan 1, April 1, July
        1, Oct 1'
- id: dues-history
  question: How have the annual HOA dues changed over the years?
  claims:
  - statement: The Declaration capped the annual assessment at $326.00 per Unit until the
      calendar year beginning January 1, 2002.
    citations:
    - chunk_id: declaration-8.4
      quote: until the calendar year beginning January 1, 2002, the annual assessment shall
        be not more than Three Hundred Twenty-Six and 00/100 ($326.00) per Unit
  - statement: From January 1, 2002 on, the Declaration allows the annual assessment to be
      increased each year, either by a vote of the Owners or by action of the Board without
      a vote of the Owners.
    citations:
    - chunk_id: declaration-8.4
      quote: the annual assessment may be increased by vote of the Owners of the Association
    - chunk_id: declaration-8.4
      quote: by action of the Board and without the necessity for a vote of the Owners
  - statement: Board meeting minutes from December 29, 2022 record a proposed 2023 budget
      with an increase of $5.00 per quarter, an assessment of $99 per quarter, and an approved
      motion to adopt the 2023 budget.
    citations:
    - chunk_id: minutes-2022-12-29-meeting
      quote: Proposed 2023 budget, increase of $5.00 per quarter. Assessment $99 per quarter
    - chunk_id: minutes-2022-12-29-meeting
      quote: Vote to adopt 2023 budget.
  - statement: The HOA website lists the 2026 assessment as $452 per year or $113 per quarter.
    citations:
    - chunk_id: home-1
      quote: '2026 Assessment Prices: $452 year or $113 per quarter'
- id: fine-second-violation
  question: Under the current rules, what is the fine for a second violation?
  claims:
  - statement: Under the current Rules, the fine for a second violation is $75.
    citations:
    - chunk_id: rules-2023-3.B
      quote: 2nd - $75
- id: fine-third-violation
  question: What is the fine for a third violation of the rules?
  claims:
  - statement: Under the current Rules, the fine for a third violation is $125.
    citations:
    - chunk_id: rules-2023-3.B
      quote: 3rd - $125
- id: fine-continuing-violation
  question: If a violation keeps going after the fines start, is there a daily fine?
  claims:
  - statement: Yes. Under the current Rules' fining schedule, the fourth and each subsequent
      violation is fined daily, at $75 per day.
    citations:
    - chunk_id: rules-2023-3.B
      quote: 4th and subsequent - fined daily@ $75 per day
  - statement: The earlier steps in that schedule are a courtesy letter for the first violation,
      $75 for the second, and $125 for the third.
    citations:
    - chunk_id: rules-2023-3.B
      quote: 1st The courtesy letter 2nd - $75 3rd - $125
- id: holiday-lights
  question: When can holiday lights go up, and when do they have to come down?
  claims:
  - statement: The Declaration and the current Rules both limit holiday decorative lights
      to the period between December 1st and January 10th.
    citations:
    - chunk_id: rules-2023-2.9
      quote: decorative lights may only be displayed between December 1st and January 10th,
        as provided in the Declaration
    - chunk_id: declaration-5.8
      quote: Seasonal holiday decorative lights may be displayed between December first
  - statement: Under the current Rules, decorative items other than lights may be displayed
      between the day after Thanksgiving and the end of January, weather permitting.
    citations:
    - chunk_id: rules-2023-2.9
      quote: decorative items may also be displayed between the day after Thanksgiving and
        the end of January (weather permitting)
  - statement: Gutter light hooks may be left attached to gutters, but the lights themselves
      may not be left attached and must be removed.
    citations:
    - chunk_id: rules-2023-2.9
      quote: Gutter light hooks may be left attached to gutters and are not in violation,
        but lights may not be left attached to gutters and must be removed.
- id: pool-guests
  question: How many guests can I bring to the pool?
  claims:
  - statement: Each Owner may bring up to two guests on their pass, and two homeowners can
      bring two guests each, for a total of four guests per household regardless of the number
      of Owners.
    citations:
    - chunk_id: rules-2023-2.14-a
      quote: Each individual Owner may bring up to two (2) guests per their pass, two homeowners
        can bring (2) guests each to the pool. Guests shall be limited to a total of four
        (4) per household are permitted regardless of the number of Owners.
  - statement: Homeowners must sign in guests at the time of entry to the pool, and no additional
      guests can be added after that time.
    citations:
    - chunk_id: rules-2023-2.14-a
      quote: Homeowner must sign in guests at the time of entry to the pool. NO additional
        guests can be added after that time.
- id: pool-unpaid-dues
  question: Can I use the pool if I'm behind on my HOA assessments?
  claims:
  - statement: Owners delinquent by more than thirty days on HOA assessments are prohibited
      from using the pool until all sums due are paid in full.
    citations:
    - chunk_id: rules-2023-2.13
      quote: Owners who are delinquent by more than thirty (30) days on the payment of any
        assessments or other charges or amounts owed to the Association shall be prohibited
        from using the clubhouse, and pool on the Property until all such sums due and owing
        to the Association are paid in full.
  - statement: The Declaration states that the Association may deny delinquent Owners use
      of Common Areas and Common Facilities (except ingress and egress to their Unit) until
      delinquent assessments and related costs are paid.
    citations:
    - chunk_id: declaration-8.10-a
      quote: the Association may deny to the delinquent Owner the use and enjoyment of any
        of the Common Areas and Common Facilities except the right to use for ingress and
        egtess to and fiom the Owner's Unit (which right shall be perpetual and pass with
        the conveyance of each Unit), until the delinquent contribution assessment or installment
        is paid, together with any interest, costs and other sums set forth above which the
        Association is entitled to receive.
- id: satellite-dish
  question: What is the largest satellite dish I'm allowed to install?
  claims:
  - statement: The current Rules permit an owner to install a satellite dish not to exceed
      39 inches in diameter.
    citations:
    - chunk_id: rules-2023-2.1
      quote: An Owner may install a satellite dish and/or internet Antenna, not to exceed
        39" (thirty-nine inches) in diameter
  - statement: The Declaration permits satellite dishes larger than 30 inches in diameter
      only if placed solely within the interior of a building on a Unit.
    citations:
    - chunk_id: declaration-5.3
      quote: no antennas, aerials, satellite dishes larger than thirty (30) inches in diameter,
        or other apparatus for the transmission and receipt of television, radio, or other
        signals of any kind shall be placed, allowed, or maintained upon any portion of a
        Unit which is not located solely within the interior of the building located on a
        Unit
  - statement: The Declaration permits satellite dishes 30 inches or less with prior Review
      Committee approval if not attached to the exterior of a building and appropriately screened.
    citations:
    - chunk_id: declaration-5.3
      quote: With the prior approval of the RC, satellite dishes 30 inches or less may be
        installed within the Properties so long as not attached to the exterior of a building
        located on a Unit and are appropriately screened from view as determined by the RC
  - statement: The current Rules require satellite dishes to be placed behind the home or
      on the rear roof out of public view, or at the closest point to the home if signal mandates
      public placement, hidden as much as possible by plants or foliage.
    citations:
    - chunk_id: rules-2023-2.1
      quote: A satellite dish should be placed behind the home or on the rear roof, out of
        public view. If signal reception mandates that the satellite dish be placed in public
        view, the dish should be placed at the closest point to the home (where an adequate
        signal can be received). This dish should be hidden as much as possible by flowering
        plants or foliage
  - statement: 'The Declaration and current Rules contain different size limits for satellite
      dishes: the Declaration limits dishes larger than 30 inches to building interiors only,
      while the current Rules permit dishes up to 39 inches.'
    kind: conflict
    citations:
    - chunk_id: declaration-5.3
      quote: satellite dishes larger than thirty (30) inches in diameter
    - chunk_id: rules-2023-2.1
      quote: not to exceed 39" (thirty-nine inches) in diameter
- id: quiet-hours
  question: What are the quiet hours in the neighborhood?
  claims:
  - statement: The current Rules say loud noises from television, stereo equipment, musical
      instruments, pets and other disturbances should be avoided at all times.
    citations:
    - chunk_id: rules-2023-2.2
      quote: Loud noises from television, stereo equipment, musical instruments, annoying
        pets and other disturbances should be avoided at all times
  - statement: The Rules single out the hours from 10 p.m. on weekdays, or 11 p.m. on weekends,
      until 8 a.m.
    citations:
    - chunk_id: rules-2023-2.2
      quote: especially between the hours of 10 p.m. on weekdays and 1 1p.m on weekends and
        8 a.m.
  - statement: A homeowner disturbed by a loud noise should first try to notify the person
      causing it, or contact local law enforcement if speaking to them seems likely to lead
      to an altercation.
    citations:
    - chunk_id: rules-2023-2.2
      quote: s/he should first attempt to notify the disturbing party
- id: arch-approval-fence-shed
  question: How do I get approval to put up a fence or a shed?
  claims:
  - statement: To modify the exterior of a home, including installing a fence or shed, plans
      must be submitted to the Architectural Review Committee for approval prior to the modification
      being made.
    citations:
    - chunk_id: rules-2023-2.11
      quote: 'Plans for any modification to the exterior of any home must be submitted to
        the Architectural Review Committee for approval prior to the modification being made.
        For the purpose of this article "modifications" shall include: 1) additions; 2) changes
        to the facade of the home, including color changes; 3) fencing and/or garden walls'
  - statement: For a shed, an Architectural Modification request with a drawing must be submitted
      to the Review Committee for approval before installation.
    citations:
    - chunk_id: rules-2023-2.20
      quote: One (1) shed per unit, no larger than 8x12x10, (96 sq. ft), no higher than 10',
        No Metal Sheds are permitted. Must submit Architectural Modification request with
        drawing required to RC for approval before installation.
  - statement: If the Review Committee fails to approve or disapprove plans or request additional
      information within 45 days after submission, the plans shall be deemed approved.
    citations:
    - chunk_id: declaration-4.2
      quote: In the event that the RC fails to apptove or to disapprove such plans or to request
        additional information reasonably required within forty-five (45) days after submission,
        the plans shall be deemed approved.
  - statement: The Declaration states that storage buildings and sheds of all kinds shall
      not be installed on the Property.
    kind: conflict
    citations:
    - chunk_id: declaration-5.11
      quote: Storage buildings and sheds of all kinds shall not be installed on the Property.
  - statement: Sheds must comply with village placement ordinance and not be on an easement,
      and wood sheds require a village permit.
    citations:
    - chunk_id: rules-2023-2.20
      quote: Must comply with village placement ordinance and not on an easement. Resin type
        must be anchored to a wooden or paver stone base. Wood Custom built to match existing
        home siding, roof shingles and constructed on a concrete base, village permit required.
- id: arch-unapproved-work
  question: What happens if I change my home's exterior without architectural approval?
  claims:
  - statement: Plans for modifications to the exterior of any home must be submitted to the
      Architectural Review Committee for approval prior to the modification being made.
    citations:
    - chunk_id: rules-2023-2.11
      quote: Plans for any modification to the exterior of any home must be submitted to the
        Architectural Review Committee for approval prior to the modification being made.
  - statement: Failure to submit plans required or to obtain written approval of the ARC prior
      to commencing work may result in a fine of $250.00 charged to the Owner's assessment
      account.
    citations:
    - chunk_id: rules-2023-2.11
      quote: Failure to submit plans required by this Section or to obtain written approval
        of the ARC prior to commencing work may result in a fine in the amount of $250.00
        being charged to the Owner's assessment account.
  - statement: Legal expenses and costs incurred by the Association or actual damages incurred
      at the Association's expense may be charged back to the Owner.
    citations:
    - chunk_id: rules-2023-3.D
      quote: In addition, any legal expenses and costs incurred by the Association or any
        actual damages incurred at the Association's expense may be charged back to the Owner.
  - statement: Any Owner assessed a violation charge shall pay any charges imposed within
      thirty (30) days of notification that such charges are due.
    citations:
    - chunk_id: rules-2023-3.D
      quote: Any Owner assessed hereunder shall pay any charges imposed within thirty (30)
        days of notification that such charges are due.
  - statement: Failure to make payment on time subjects the Owner to all legal or equitable
      remedies necessary for collection.
    citations:
    - chunk_id: rules-2023-3.D
      quote: Failure to make the payment on time shall subject the Owner to all of the legal
        or equitable remedies necessary for the collection thereof.
  - statement: Failure to rectify a violation can result in legal action and/or Board action
      to correct the violation, with all expenses including attorneys' fees and court costs
      charged to the responsible Owner's account.
    citations:
    - chunk_id: rules-2023-3.D
      quote: Failure to rectify a violation can result in legal action and/or action by the
        Board to correct the violation, and all expenses incurred by the Association, including
        but not limited to attorneys' fees and court costs, in connection with any violations
        of the Declaration, By-laws, or these Rules and Regulations and/or the enforcement
        thereof shall be charged to the responsible Owner's account.
